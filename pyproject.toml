[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myapp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-qt>=4.4",
  "pytest-xvfb>=3; sys_platform == 'linux'",
  "pyinstaller>=6.6",
]

[project.gui-scripts]
myapp = "myapp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
